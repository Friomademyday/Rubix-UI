<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rubix AI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #111111;
      color: #FFFFFF;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Layout Containers */
    .app-header {
      height: 60px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Message Styling */
    .message {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
    }

    .user-message {
      align-self: flex-end;
      background-color: #2563EB;
      color: #FFF;
    }

    .ai-message {
      align-self: flex-start;
      background-color: #1E1E1E;
      border: 1px solid #333;
      color: #EEE;
    }

    /* Indicator Block */
    .thinking-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      background-color: #1E1E1E;
      border: 1px solid #333;
      padding: 8px 14px;
      border-radius: 12px;
    }

    #cube-canvas {
      width: 24px;
      height: 24px;
      display: block;
    }

    .thinking-text {
      font-size: 14px;
      color: #888;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1.0; }
    }

    /* Composer */
    .composer {
      padding: 20px;
      border-top: 1px solid #222;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      background-color: #1E1E1E;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 12px 16px;
      color: #FFF;
      outline: none;
    }

    button {
      background-color: #2563EB;
      color: #FFF;
      border: none;
      padding: 0 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background-color: #1D4ED8;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h3>Rubix AI</h3>
  </header>

  <main class="chat-container" id="chat-container">
    <div class="message ai-message">Hello! Ask me anything to get started.</div>
  </main>

  <div id="thinking-indicator" class="thinking-wrapper" style="display: none;">
    <canvas id="cube-canvas"></canvas>
    <span class="thinking-text" id="thinking-text">Rubixing...</span>
  </div>

  <footer class="composer">
    <input type="text" id="user-input" placeholder="Type a message..." onkeydown="handleKey(event)">
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    // --- 3D RUBIK'S CUBE (THREE.JS ENGINE) ---
    let scene, camera, renderer, rubiksCube;
    let isSpinning = false;
    let animationFrameId;

    function initCube() {
      const canvas = document.getElementById('cube-canvas');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      camera.position.set(3, 3, 3);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
      renderer.setSize(24, 24);
      renderer.setPixelRatio(window.devicePixelRatio);

      // Create Rubik's Cube geometry (3x3 grid using standard colors)
      rubiksCube = new THREE.Group();
      const faceColors = [0xb71c1c, 0x0d47a1, 0x1b5e20, 0xe65100, 0xffeb3b, 0xffffff];
      const materials = faceColors.map(color => new THREE.MeshBasicMaterial({ color }));

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            const geo = new THREE.BoxGeometry(0.56, 0.56, 0.56);
            const subCube = new THREE.Mesh(geo, materials);
            subCube.position.set(x * 0.6, y * 0.6, z * 0.6);
            
            // Add subtle wireframe edges to distinguish sub-blocks
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 }));
            subCube.add(line);
            
            rubiksCube.add(subCube);
          }
        }
      }

      scene.add(rubiksCube);
      renderer.render(scene, camera);
    }

    function animateCube() {
      if (isSpinning) {
        rubiksCube.rotation.x += 0.03;
        rubiksCube.rotation.y += 0.04;
        renderer.render(scene, camera);
        animationFrameId = requestAnimationFrame(animateCube);
      }
    }

    function startCubeSpin() {
      if (!isSpinning) {
        isSpinning = true;
        animateCube();
      }
    }

    function stopCubeSpin() {
      isSpinning = false;
      cancelAnimationFrame(animationFrameId);
    }

    // --- APPLICATION LOGIC ---
    window.addEventListener('DOMContentLoaded', () => {
      initCube();
    });

    function handleKey(event) {
      if (event.key === 'Enter') sendMessage();
    }

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      const chatContainer = document.getElementById('chat-container');

      // Append User Message
      const userMsg = document.createElement('div');
      userMsg.className = 'message user-message';
      userMsg.textContent = text;
      chatContainer.appendChild(userMsg);
      input.value = '';

      // Show & Start Indicator Spin
      const indicator = document.getElementById('thinking-indicator');
      chatContainer.appendChild(indicator);
      indicator.style.display = 'flex';
      startCubeSpin();

      chatContainer.scrollTop = chatContainer.scrollHeight;

      // Simulate AI Response Delay
      setTimeout(() => {
        // Stop Cube Spin
        stopCubeSpin();
        indicator.style.display = 'none';

        // Append AI Response
        const aiMsg = document.createElement('div');
        aiMsg.className = 'message ai-message';
        aiMsg.textContent = 'This response was calculated using the JS WebGL rendering engine.';
        chatContainer.appendChild(aiMsg);

        chatContainer.scrollTop = chatContainer.scrollHeight;
      }, 2500);
    }
  </script>
</body>
</html>
